spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.sql.init.mode=never

# Use random port in tests when needed
server.port=0

# JWT Secret Key for testing (must be at least 32 bytes/256 bits for HMAC-SHA)
jwt.secret=ThisIsAVeryLongSecretKeyForTestingJWTTokenGenerationAndValidation1234567890
jwt.expiration=86400000

# Internal API Key for testing
internal.api-key=test-internal-api-key

# AI Service URL
ai.service.url=http://localhost:5000/api/recognize

# University Index properties for testing
university.index.base-url=http://localhost:8081
university.index.timeout=5000
university.index.api-key=test-key

# Storage path
file.upload-dir=uploads/test
