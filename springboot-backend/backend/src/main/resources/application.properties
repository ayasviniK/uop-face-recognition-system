spring.application.name=backend

# --- DataSource ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/uop_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=root
spring.datasource.password=123Root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA ---
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Run SQL schema initialization from src/main/resources/schema.sql
spring.sql.init.mode=always

# SQL logging (helpful during development)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Storage path
file.upload-dir=${FILE_UPLOAD_DIR:uploads/students}

# AI service (Flask) URL - set to your AI service endpoint
ai.service.url=${AI_SERVICE_URL:http://localhost:5000/api/recognize}

# JWT Configuration
jwt.secret=ThisIsASecretKeyForDevelopmentOnly123456789012345
jwt.expiration=86400000
