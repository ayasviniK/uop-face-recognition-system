spring.application.name=backend

# --- DataSource ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/uop_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA ---
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Run SQL schema initialization from src/main/resources/schema.sql
spring.sql.init.mode=always

# SQL logging (helpful during development)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Storage path for temporary probe images
file.upload-dir=${FILE_UPLOAD_DIR:uploads/students}

# AI service (Flask) URL - endpoint for ArcFace face recognition
ai.service.url=${AI_SERVICE_URL:http://localhost:5000/api/recognize}

# JWT Configuration for Administrator authentication
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Internal API Key for Flask AI Service to Spring Boot communication
internal.api-key=${INTERNAL_API_KEY}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# University Index API Configuration
# TODO: Obtain official University Index API base URL.
university.index.base-url=${UNIVERSITY_INDEX_BASE_URL:}
university.index.timeout=${UNIVERSITY_INDEX_TIMEOUT:5000}
university.index.api-key=${UNIVERSITY_INDEX_API_KEY:}
