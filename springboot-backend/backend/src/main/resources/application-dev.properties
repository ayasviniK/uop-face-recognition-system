# Development Profile (In-Memory Database for local testing without local MySQL)
spring.datasource.url=jdbc:h2:mem:uop_db;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Auto create/update tables from JPA entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable MySQL schema.sql initialization for H2
spring.sql.init.mode=never
