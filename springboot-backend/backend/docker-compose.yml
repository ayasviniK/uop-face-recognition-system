version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: uop-mysql-db
    environment:
      MYSQL_DATABASE: uop_db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uop-spring-backend
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:mysql://db:3306/uop_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - DB_USERNAME=root
      - DB_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      - AI_SERVICE_URL=${AI_SERVICE_URL:-http://host.docker.internal:5000/api/recognize}
      - FILE_UPLOAD_DIR=/app/uploads/students
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - UNIVERSITY_INDEX_BASE_URL=${UNIVERSITY_INDEX_BASE_URL:-}
      - UNIVERSITY_INDEX_TIMEOUT=${UNIVERSITY_INDEX_TIMEOUT:-5000}
      - UNIVERSITY_INDEX_API_KEY=${UNIVERSITY_INDEX_API_KEY:-}
    volumes:
      - upload_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  db_data:
  upload_data: