version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: uop-mysql-db
    environment:
      MYSQL_DATABASE: uop_db
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uop-spring-backend
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:mysql://db:3306/uop_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - DB_USERNAME=root
      - DB_PASSWORD=rootpassword
      - JWT_SECRET=ThisIsAVeryLongSecretKeyForProductionJWTTokenGenerationAndValidation1234567890
      - AI_SERVICE_URL=http://host.docker.internal:5000/api/recognize
      - FILE_UPLOAD_DIR=/app/uploads/students
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=adminpassword
    volumes:
      - upload_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  db_data:
  upload_data:
